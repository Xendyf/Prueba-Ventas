<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página de venta - Polos para Hombre</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
      color: #333;
    }
    header {
      background-color: #1a1a1a;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav a {
      color: white;
      margin: 0 1rem;
      text-decoration: none;
      font-weight: 500;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .hero {
      background: url('https://via.placeholder.com/1200x400') no-repeat center center/cover;
      color: white;
      padding: 5rem 2rem;
      text-align: center;
    }
    .hero h1 {
      font-size: 3rem;
      margin: 0;
    }
    .section {
      margin: 3rem 0;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 2rem;
    }
    .product {
      background-color: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .product img {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }
    .product-details {
      padding: 1rem;
      text-align: center;
    }
    .buy-btn {
      background-color: #1a1a1a;
      color: white;
      border: none;
      padding: 0.5rem 1.5rem;
      cursor: pointer;
      margin-top: 1rem;
      border-radius: 5px;
    }
    .buy-btn:hover {
      background-color: #333;
    }
    footer {
      text-align: center;
      padding: 2rem 1rem;
      background-color: #1a1a1a;
      color: white;
    }
  </style>
</head>
<body>
  <header>
    <h2>Elegancia Masculina</h2>
    <nav>
      <a href="#inicio">Inicio</a>
      <a href="#catalogo">Catálogo</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>

  <section id="inicio" class="hero">
    <h1>Polos Premium para Hombre</h1>
    <p>Diseño, calidad y estilo en una sola prenda.</p>
  </section>

  <section id="catalogo" class="container section">
    <h2>Catálogo</h2>
    <div class="products">
      <div class="product">
        <img src="https://via.placeholder.com/400x300" alt="Polo Clásico">
        <div class="product-details">
          <h3>Polo Clásico</h3>
          <p>S/ 59.90</p>
          <button class="buy-btn" onclick="window.open('https://wa.me/51987654321?text=Hola, quiero comprar el Polo Clásico')">Comprar</button>
        </div>
      </div>
      <div class="product">
        <img src="https://via.placeholder.com/400x300" alt="Polo Deportivo">
        <div class="product-details">
          <h3>Polo Deportivo</h3>
          <p>S/ 64.90</p>
          <button class="buy-btn" onclick="window.open('https://wa.me/51987654321?text=Hola, quiero comprar el Polo Deportivo')">Comprar</button>
        </div>
      </div>
      <!-- Puedes duplicar más productos aquí -->
    </div>
  </section>

  <section id="contacto" class="container section">
    <h2>Contacto</h2>
    <p>¿Tienes preguntas? Escríbenos por <a href="https://wa.me/51942994707" target="_blank">WhatsApp</a>.</p>
  </section>

  <footer>
    <p>&copy; 2025 Elegancia Masculina - Todos los derechos reservados</p>
  </footer>
</body>
</html>
